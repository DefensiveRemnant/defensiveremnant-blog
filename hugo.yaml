baseURL: https://example.org/
locale: en-us
title: My New Hugo Project
theme: ["PaperMod"]
paginate: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Your Name"
  description: "Technology and ministry resources"
  profileMode:
    enabled: false
  homeInfoParams:
    Title: "Welcome to Your Name"
    Content: "I write about technology, cybersecurity, infrastructure, and educational resources."
  socialIcons:
    - name: email
      url: "mailto:your@email.com"

menu:
  main:
    - name: Technology
      url: /tech/
      weight: 10
    - name: Ministry
      url: /ministry/
      weight: 20
    - name: About
      url: /about/
      weight: 30